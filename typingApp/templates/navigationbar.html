<style>
    /* Existing styles - with increased specificity to prevent override */
    body {
      background-color: #f7fafc !important; /* Equivalent to bg-gray-100 */
      color: #1a202c !important; /* Equivalent to text-gray-900 */
    }
    
    .navbar-custom {
      background-color: #0d6073 !important; /* Custom navbar color */
    }
    
    .navbar-custom .nav-link {
      color: white !important; /* Navbar link color */
      font-size: 1.2rem !important; /* Update font size for navbar links */
    }
    
    .navbar-custom .nav-link:hover {
      color: #ffd700 !important; /* Equivalent to hover:text-yellow-400 */
    }
    
    .navbar-custom .dropdown-menu {
      background-color: #0d6073 !important; /* Match dropdown background color to navbar */
    }
    
    .navbar-custom .dropdown-menu .dropdown-item {
      color: white !important; /* Dropdown item text color */
      font-size: 1.1rem !important; /* Update font size for dropdown items */
    }
    
    .navbar-custom .dropdown-menu .dropdown-item:hover {
      background-color: #ffd700 !important; /* Change background color on hover */
      color: #0d6073 !important; /* Change text color on hover */
    }
    
    /* Show dropdown on hover */
    .navbar-custom .dropdown:hover .dropdown-menu {
      display: block !important;
    }
    
    .navbar-custom .navbar-brand {
      color: white !important;
    }
    
    .navbar-custom .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
    }
</style>

<div id="app">
    <!-- Full-width Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img src="/static/taptaptyping logo.jpg" alt="Logo" class="rounded-circle" style="width: 40px; height: 40px;">
          TapTapTyping
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'typingLession' %}">Lesson</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'taptap' %}">Typing Test</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'typingGame' %}">Games</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'blogs' %}">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'jobs' %}">JobPosts</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" aria-expanded="false">
                Others
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{% url 'FAQ' %}">FAQ</a></li>
                <li><a class="dropdown-item" href="{% url 'aboutus' %}">About Us</a></li>
                <li><a class="dropdown-item" href="{% url 'policy' %}">Terms & Privacy</a></li>
              </ul>
            </li>
            {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'logout' %}">Logout</a>
              <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'login' %}">Login</a>
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
</div>
